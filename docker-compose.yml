services:
  neo4j:
    image: neo4j:5-community
    container_name: gitgraph-neo4j
    ports:
      - "7474:7474"   # browser / http
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-gitgraph}"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "2g"
      NEO4J_server_memory_pagecache_size: "512m"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  neo4j_data:
  neo4j_logs:
